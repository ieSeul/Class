:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:#1b1b3a;color:#fff;font-family:PixelKR,'Press Start 2P',monospace;font-synthesis:none;font-size:16px;display:flex;justify-content:center}
#wrap{width:100%;max-width:520px;padding:12px}
h1{font-family:'Press Start 2P',PixelKR,monospace;font-weight:400;font-size:clamp(16px,4.2vw,32px);line-height:1.6;text-align:center;margin:6px 0 10px;color:#ffd84a;text-shadow:3px 3px 0 #c0392b}
h1 small{display:block;font-family:PixelKR;font-size:24px;margin-top:6px;color:#8be9fd;text-shadow:none}
.box{border:4px solid #fff;box-shadow:0 0 0 4px #000;background:#2a2a55;position:relative}
canvas{display:block;width:100%;image-rendering:pixelated;background:#000}
#hud{display:flex;justify-content:space-between;font-family:'Press Start 2P',monospace;font-size:clamp(9px,2.6vw,13px);padding:10px 12px;background:#000}
#q{margin-top:16px;padding:14px;min-height:190px}
#sent{font-size:32px;font-weight:400;line-height:1.5;text-align:center;margin:6px 0}
#sent u{color:#ffd84a;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
#claim{text-align:center;font-size:24px;margin:10px 0 14px;color:#8be9fd}
#claim b{color:#fff;background:#8e44ad;padding:1px 6px}
